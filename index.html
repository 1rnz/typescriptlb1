<!DOCTYPE HTML>
<html>
	<head>
		<title>Massively by HTML5 UP</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

		<style>
			/* Простий стиль для модального вікна */
			#modal {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0,0,0,0.6);
				justify-content: center;
				align-items: center;
			}
			#modal .content {
				background: white;
				padding: 20px;
				border-radius: 8px;
				max-width: 300px;
				text-align: center;
			}
		</style>

	</head>
	<body class="is-preload">

		<!-- Wrapper -->
		<div id="wrapper" class="fade-in">

			<!-- Intro -->
			<div id="intro">
				<h1>This is<br/>Massively</h1>
				<p>A free, fully responsive HTML5 + CSS3 site template...</p>
				<ul class="actions">
					<li>
						<a href="#header" class="button icon solid solo fa-arrow-down scrolly">
							Continue
						</a>
					</li>
				</ul>

				<!-- Кнопка для відкриття модального вікна -->
				<button id="openModal" class="button">Відкрити модальне вікно</button>
			</div>

			<!-- Header -->
			<header id="header">
				<a href="index.html" class="logo">Massively</a>
			</header>

			<!-- Навігація -->
			<nav id="nav">...</nav>

			<!-- Основний контент -->
			<div id="main">

				<!-- Featured Post -->
				<article class="post featured">
					<header class="major">
						<h2><a href="#">Massive headline</a></h2>
						<p>Example text...</p>
					</header>
					<a href="#" class="image main"><img src="images/pic01.jpg" alt="" /></a>
				</article>

				<!-- Данні з JSONPlaceholder -->
				<section>
					<header class="major">
						<h2>Користувачі (JSONPlaceholder)</h2>
					</header>

					<div id="users" style="padding: 10px; border: 1px solid #ddd;">
						<p>Дані завантажуються...</p>
					</div>
				</section>

				<!-- Решта контенту -->
				<section class="posts">...</section>
			</div>

			<!-- Footer -->
			<footer id="footer">...</footer>

			<div id="copyright">...</div>
		</div>

		<!-- Модальне вікно -->
		<div id="modal">
			<div class="content">
				<h3>Модальне вікно</h3>
				<p>Це модальний блок, доданий через TypeScript.</p>
				<button id="closeModal" class="button">Закрити</button>
			</div>
		</div>

		<!-- Стандартні скрипти шаблону -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<!-- 🔥 Підключення твого скомпільованого JS -->
		<script src="dist/script.js"></script>

	</body>
</html>
